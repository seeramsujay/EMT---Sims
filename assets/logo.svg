<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 500" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#070c18"/>
      <stop offset="100%" stop-color="#111827"/>
    </linearGradient>
    <linearGradient id="eFieldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00f2fe"/>
      <stop offset="100%" stop-color="#4facfe"/>
    </linearGradient>
    <linearGradient id="bFieldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ff007f"/>
      <stop offset="100%" stop-color="#7928ca"/>
    </linearGradient>
    <linearGradient id="poyntingGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffd166"/>
      <stop offset="100%" stop-color="#f78c6b"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <!-- Base Badge -->
  <rect width="500" height="500" rx="100" fill="url(#bgGrad)"/>
  <rect width="492" height="492" x="4" y="4" rx="96" fill="none" stroke="#00f2fe" stroke-width="2" stroke-opacity="0.3"/>

  <!-- Electromagnetic Wave Axis (Propagation z-axis) -->
  <line x1="80" y1="250" x2="420" y2="250" stroke="url(#poyntingGrad)" stroke-width="4" stroke-linecap="round" filter="url(#glow)"/>
  <!-- Poynting Vector Arrowhead -->
  <polygon points="420,250 405,242 405,258" fill="#ffd166"/>

  <!-- Electric Field Sinusoidal Wave (Vertical Transverse Plane) -->
  <path d="M 80 250 Q 140 130 200 250 T 320 250 T 400 250" fill="none" stroke="url(#eFieldGrad)" stroke-width="5" stroke-linecap="round" filter="url(#glow)"/>
  <!-- E-Field Vertical Vector Field Arrows -->
  <line x1="140" y1="250" x2="140" y2="160" stroke="#00f2fe" stroke-width="2.5" stroke-linecap="round"/>
  <polygon points="140,152 135,162 145,162" fill="#00f2fe"/>
  <line x1="260" y1="250" x2="260" y2="340" stroke="#00f2fe" stroke-width="2.5" stroke-linecap="round"/>
  <polygon points="260,348 135,338 145,338" fill="#00f2fe"/>

  <!-- Magnetic Field Sinusoidal Wave (Horizontal Transverse Plane - Isometric Shear) -->
  <path d="M 80 250 Q 120 290 200 250 T 320 250 T 400 250" fill="none" stroke="url(#bFieldGrad)" stroke-width="5" stroke-dasharray="6 8" stroke-linecap="round" filter="url(#glow)"/>
  <!-- B-Field Horizontal Vector Field Arrows -->
  <line x1="260" y1="250" x2="295" y2="285" stroke="#ff007f" stroke-width="2.5" stroke-linecap="round"/>
  <polygon points="300,290 290,285 295,280" fill="#ff007f"/>

  <!-- Central Maxwell Del / Nabla Glyph -->
  <polygon points="250,90 270,125 230,125" fill="none" stroke="#ffd166" stroke-width="3" filter="url(#glow)"/>
  <text x="250" y="117" font-family="monospace" font-size="16" fill="#ffd166" font-weight="bold" text-anchor="middle">∇</text>
</svg>
