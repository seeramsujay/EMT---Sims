<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Lecture 7: Poisson & Laplace Solver - 23ECE204 EMT Simulator</title>
    
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Fira+Code:wght@400;600&family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">

    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/controls/OrbitControls.js"></script>

    <style>
        :root {
            --bg-main: #0d1117;
            --bg-panel: rgba(22, 27, 34, 0.85);
            --bg-control: #21262d;
            --border-color: #30363d;
            --text-main: #c9d1d9;
            --text-heading: #f0f6fc;
            --text-muted: #8b949e;
            --accent-primary: #58a6ff;
            --font-main: 'Inter', system-ui, sans-serif;
            --font-mono: 'Fira Code', monospace;
        }
        [data-theme="light"] {
            --bg-main: #f6f8fa;
            --bg-panel: rgba(255, 255, 255, 0.9);
            --bg-control: #eff1f3;
            --border-color: #d0d7de;
            --text-main: #24292f;
            --text-heading: #1f2328;
            --text-muted: #57606a;
            --accent-primary: #0969da;
        }
        [data-theme="cyberpunk"] {
            --bg-main: #030712;
            --bg-panel: rgba(12, 16, 43, 0.9);
            --bg-control: #1a1f4c;
            --border-color: #00f0ff;
            --text-main: #e0f7fc;
            --text-heading: #00f0ff;
            --text-muted: #70a0c0;
            --accent-primary: #00f0ff;
        }
        * { box-sizing: border-box; }
        body {
            margin: 0; padding: 0; width: 100vw; height: 100vh; overflow: hidden;
            background-color: var(--bg-main); color: var(--text-main); font-family: var(--font-main);
        }
        #app-header {
            position: absolute; top: 0; left: 0; width: 100vw; height: 52px;
            background: var(--bg-panel); backdrop-filter: blur(10px); border-bottom: 1px solid var(--border-color);
            display: flex; align-items: center; justify-content: space-between; padding: 0 16px; z-index: 100;
        }
        .header-title { font-weight: 700; font-size: 15px; color: var(--text-heading); display: flex; align-items: center; gap: 10px; }
        .badge { background: var(--accent-primary); color: #fff; padding: 2px 8px; border-radius: 12px; font-size: 11px; font-family: var(--font-mono); }
        .nav-btn {
            background: var(--bg-control); border: 1px solid var(--border-color); color: var(--text-main);
            padding: 6px 12px; border-radius: 6px; font-size: 12px; cursor: pointer; text-decoration: none; display: flex; align-items: center; gap: 6px;
        }
        .nav-btn:hover { border-color: var(--accent-primary); color: var(--accent-primary); }
        #canvas-container, #canvas2d-container { width: 100vw; height: calc(100vh - 52px); position: absolute; top: 52px; left: 0; }
        #control-panel {
            position: absolute; top: 68px; right: 16px; width: 320px; max-height: calc(100vh - 84px);
            background: var(--bg-panel); backdrop-filter: blur(12px); border: 1px solid var(--border-color);
            border-radius: 10px; padding: 16px; z-index: 80; overflow-y: auto;
        }
        .panel-title { font-size: 14px; font-weight: 700; color: var(--text-heading); margin: 0 0 12px 0; display: flex; justify-content: space-between; }
        .control-group { margin-bottom: 14px; }
        .control-group label { display: flex; justify-content: space-between; font-size: 11px; font-weight: 600; text-transform: uppercase; color: var(--text-muted); margin-bottom: 6px; }
        .control-group label .val { color: var(--accent-primary); font-family: var(--font-mono); }
        input[type="range"] { width: 100%; accent-color: var(--accent-primary); cursor: pointer; }
        select { width: 100%; background: var(--bg-control); border: 1px solid var(--border-color); color: var(--text-main); padding: 6px; border-radius: 6px; }
        #theory-overlay {
            position: absolute; bottom: 16px; left: 16px; max-width: 440px;
            background: var(--bg-panel); backdrop-filter: blur(12px); border: 1px solid var(--border-color);
            border-radius: 10px; padding: 14px 16px; z-index: 80; font-size: 12px; line-height: 1.5;
        }
        .btn-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; margin-top: 8px; }
        .sim-btn { background: var(--bg-control); border: 1px solid var(--border-color); color: var(--text-main); padding: 6px; border-radius: 6px; font-size: 11px; cursor: pointer; }
        .sim-btn.active { background: var(--accent-primary); color: #fff; }
        .legend-row { display: flex; align-items: center; gap: 8px; margin: 4px 0; font-size: 11px; }
        .legend-color { width: 12px; height: 12px; border-radius: 3px; }
    </style>
</head>
<body>
    <header id="app-header">
        <div class="header-title">
            <span>Lecture 7: Poisson & Laplace Solver</span>
            <span class="badge">2D FDM Grid Solver</span>
        </div>
        <div style="display:flex; gap:8px;">
            <a href="index.html" class="nav-btn">🏠 Main Hub</a>
            <a href="Lec6_Potential_and_Work.html" class="nav-btn">◀ Prev</a>
            <a href="Lec8_Electrostatic_Boundaries.html" class="nav-btn">Next ▶</a>
            <button class="nav-btn" onclick="cycleTheme()">🎨 Theme</button>
        </div>
    </header>

    <div id="canvas-container"></div>
    <canvas id="canvas2d-container" style="display:none;"></canvas>

    <div id="control-panel">
        <div class="panel-title">
            <span>Parameters</span>
            <span style="font-size:11px; opacity:0.7;">Interactive</span>
        </div>
        
            <div class="control-group">
                <label>Top Plate Potential (V1) <span class="val" id="val-v1">100 V</span></label>
                <input type="range" id="v1" min="0" max="100" value="100" step="5" oninput="renderGrid()">
            </div>
            <div class="control-group">
                <label>Bottom Plate Potential (V2) <span class="val" id="val-v2">0 V</span></label>
                <input type="range" id="v2" min="0" max="100" value="0" step="5" oninput="renderGrid()">
            </div>
        
        <div id="legend">
            <div class="legend-row"><b>Heatmap: Blue (0V) → Red (100V)</b></div>
        </div>
    </div>

    <div id="theory-overlay">
        <h4 style="margin:0 0 6px 0; color:var(--text-heading);">Lecture 7: Poisson & Laplace Solver Theory</h4>
        <div>• <b>Laplace Equation</b>: ∇²V = 0.<br>• <b>Poisson Equation</b>: ∇²V = -ρ / ε.<br>• Solved using iterative Finite Difference Method grid.</div>
    </div>

    <script>
        const themes = ['dark', 'light', 'cyberpunk'];
        let currentThemeIdx = 0;
        function cycleTheme() {
            currentThemeIdx = (currentThemeIdx + 1) % themes.length;
            const theme = themes[currentThemeIdx];
            document.documentElement.setAttribute('data-theme', theme);
            let bgColor = 0x0d1117;
            if (theme === 'light') bgColor = 0xf6f8fa;
            if (theme === 'cyberpunk') bgColor = 0x030712;
            if (renderer) renderer.setClearColor(bgColor, 1);
        }

        const container = document.getElementById('canvas-container');
        const scene = new THREE.Scene();
        const camera = new THREE.PerspectiveCamera(45, window.innerWidth / (window.innerHeight - 52), 0.1, 1000);
        camera.position.set(0, 6, 14);

        const renderer = new THREE.WebGLRenderer({ antialias: true });
        renderer.setSize(window.innerWidth, window.innerHeight - 52);
        renderer.setPixelRatio(window.devicePixelRatio);
        renderer.setClearColor(0x0d1117, 1);
        container.appendChild(renderer.domElement);

        const controls = new THREE.OrbitControls(camera, renderer.domElement);
        controls.enableDamping = true;

        scene.add(new THREE.AmbientLight(0xffffff, 0.7));
        const dirLight = new THREE.DirectionalLight(0xffffff, 0.8);
        dirLight.position.set(10, 15, 10);
        scene.add(dirLight);

        let activeObjects = [];

        
            document.getElementById('canvas-container').style.display = 'none';
            const c2d = document.getElementById('canvas2d-container');
            c2d.style.display = 'block';
            c2d.width = window.innerWidth;
            c2d.height = window.innerHeight - 52;
            const ctx = c2d.getContext('2d');
            window.renderGrid = function() {
                const W = c2d.width, H = c2d.height;
                ctx.clearRect(0,0,W,H);
                const V1 = parseFloat(document.getElementById('v1').value);
                const V2 = parseFloat(document.getElementById('v2').value);
                document.getElementById('val-v1').innerText = V1 + ' V';
                document.getElementById('val-v2').innerText = V2 + ' V';
                const cols = 40, rows = 30;
                const cw = W / cols, ch = H / rows;
                for(let r = 0; r < rows; r++) {
                    for(let c = 0; c < cols; c++) {
                        const norm = (V2 + (V1 - V2) * (1 - r/rows)) / 100;
                        ctx.fillStyle = `rgb(${Math.floor(norm*255)}, 55, ${Math.floor((1-norm)*255)})`;
                        ctx.fillRect(c*cw, r*ch, cw-1, ch-1);
                    }
                }
            };
            renderGrid();
        

        function animate() {
            requestAnimationFrame(animate);
            controls.update();
            if (window.isEMWave) {
                const freq = parseFloat(document.getElementById('wfreq')?.value || 1.0);
                window.animTime += 0.03 * freq;
                activeObjects.forEach(o => scene.remove(o));
                activeObjects = [];
                const ePts = [], hPts = [];
                for (let z = -6; z <= 6; z += 0.2) {
                    const ex = Math.sin(z * 1.5 - window.animTime) * 2;
                    const hy = Math.sin(z * 1.5 - window.animTime) * 2;
                    ePts.push(new THREE.Vector3(ex, 0, z));
                    hPts.push(new THREE.Vector3(0, hy, z));
                }
                const eLine = new THREE.Line(new THREE.BufferGeometry().setFromPoints(ePts), new THREE.LineBasicMaterial({ color: 0x58a6ff, linewidth: 2 }));
                const hLine = new THREE.Line(new THREE.BufferGeometry().setFromPoints(hPts), new THREE.LineBasicMaterial({ color: 0xf85149, linewidth: 2 }));
                scene.add(eLine); activeObjects.push(eLine);
                scene.add(hLine); activeObjects.push(hLine);
            }
            renderer.render(scene, camera);
        }
        animate();

        window.addEventListener('resize', () => {
            camera.aspect = window.innerWidth / (window.innerHeight - 52);
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight - 52);
        });
    </script>
</body>
</html>
